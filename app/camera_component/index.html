<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px "Segoe UI",sans-serif;color:#183c36;background:transparent}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button,select{font:inherit;border:1px solid #c9d9d2;border-radius:8px;padding:10px 14px;background:#fff;color:#183c36;min-height:42px}
button{cursor:pointer}button.primary{background:#157e75;border-color:#157e75;color:white}button:disabled{opacity:.45;cursor:default}
select{flex:1;min-width:150px;max-width:100%}button:focus-visible,select:focus-visible{outline:3px solid #58a99e;outline-offset:2px}
.stage{position:relative;aspect-ratio:4/3;background:#e8efeb;border-radius:12px;overflow:hidden;width:100%}
video,canvas.overlay{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:contain}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#55716a}
#notice{font-size:13px;color:#55716a;margin:8px 0 0;min-height:18px}#notice.error{color:#a82b29}
[hidden]{display:none!important}
</style></head>
<body>
<div class="controls"><button id="start" class="primary">Activar cámara</button><button id="stop" disabled>Detener</button>
<select id="device" aria-label="Cámara"><option value="">Cámara automática</option></select></div>
<div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><canvas class="overlay" id="overlay"></canvas>
<div class="empty" id="empty">Activa la cámara para reconocer un residuo.</div></div>
<p id="notice" role="status" aria-live="polite"></p>
<script>
// Streamlit's public v1 component message protocol; no external scripts or services.
const $=id=>document.getElementById(id);
const video=$('video'),overlay=$('overlay'),pen=overlay.getContext('2d');
const capture=document.createElement('canvas'),capturePen=capture.getContext('2d');
let media=null,streamId='',sequence=0,pending=null,lastSent=0,detection=null,lastDetection=0,opening=false,height=0;
let enabled=true,interval=250;
function post(type,details){window.parent.postMessage({isStreamlitMessage:true,type,...details},'*');}
function send(value){post('streamlit:setComponentValue',{value,dataType:'json'});}
function resize(){const value=Math.ceil(document.body.scrollHeight);if(value!==height){height=value;post('streamlit:setFrameHeight',{height:value});}}
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';resize();}
function buttons(){$('start').disabled=!!media||opening||!enabled;$('stop').disabled=!media&&!opening;}
async function devices(){
  if(!navigator.mediaDevices?.enumerateDevices)return;
  const selected=$('device').value,list=await navigator.mediaDevices.enumerateDevices();
  $('device').replaceChildren(new Option('Cámara automática',''));
  list.filter(d=>d.kind==='videoinput').forEach((d,i)=>$('device').add(new Option(d.label||`Cámara ${i+1}`,d.deviceId)));
  if([...$('device').options].some(o=>o.value===selected))$('device').value=selected;
}
function stop(report=true){
  const previous=streamId;
  if(media)media.getTracks().forEach(track=>track.stop());
  media=null;video.srcObject=null;pending=null;detection=null;opening=false;
  pen.clearRect(0,0,overlay.width,overlay.height);$('empty').hidden=false;
  if(report&&previous)send({event:'stopped',stream_id:previous,sequence:++sequence});
  streamId='';buttons();notice('');
}
async function start(){
  if(opening||media)return;
  if(!navigator.mediaDevices?.getUserMedia){notice('Abre la aplicación con HTTPS y un navegador con acceso a cámara.',true);return;}
  opening=true;buttons();notice('Autoriza la cámara en tu navegador.');
  const selected=$('device').value;
  try{
    const constraints={width:{ideal:1280,max:1920},height:{ideal:720,max:1080},frameRate:{ideal:30,max:30}};
    if(selected)constraints.deviceId={exact:selected};else constraints.facingMode={ideal:'environment'};
    const acquired=await navigator.mediaDevices.getUserMedia({video:constraints,audio:false});
    if(!opening){acquired.getTracks().forEach(track=>track.stop());return;}
    media=acquired;streamId=crypto.randomUUID();sequence=0;pending=null;lastSent=0;detection=null;
    video.srcObject=media;await video.play();opening=false;$('empty').hidden=true;buttons();notice('');
    const actual=media.getVideoTracks()[0].getSettings();
    $('stage').style.aspectRatio=`${actual.width||video.videoWidth}/${actual.height||video.videoHeight}`;
    await devices();resize();
  }catch(error){
    stop(false);
    const messages={NotAllowedError:'Autoriza el acceso a la cámara para usar el video.',NotFoundError:'No se encontró una cámara. Conéctala y vuelve a intentar.',NotReadableError:'La cámara está ocupada. Cierra otras aplicaciones que la estén usando.',OverconstrainedError:'Esta cámara no admite la configuración solicitada. Prueba otra cámara.'};
    notice(messages[error.name]||'No se pudo abrir la cámara. Comprueba su conexión y vuelve a intentar.',true);
  }
}
function tick(now){
  if(media&&video.readyState>=2){
    if(overlay.width!==video.videoWidth||overlay.height!==video.videoHeight){overlay.width=video.videoWidth;overlay.height=video.videoHeight;}
    pen.clearRect(0,0,overlay.width,overlay.height);
    if(detection&&now-lastDetection<650){
      const [x1,y1,x2,y2]=detection.box;
      pen.lineWidth=Math.max(2,overlay.width/320);pen.strokeStyle=detection.confirmed?'#157e75':'#d78c14';
      pen.strokeRect(x1*overlay.width,y1*overlay.height,(x2-x1)*overlay.width,(y2-y1)*overlay.height);
      pen.font=`600 ${Math.max(18,overlay.width/38)}px Segoe UI`;pen.fillStyle=pen.strokeStyle;
      pen.fillText(detection.label,Math.max(4,x1*overlay.width),Math.max(24,y1*overlay.height-8));
    }
    if(!pending&&now-lastSent>=interval&&enabled&&!document.hidden){
      const scale=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight));
      capture.width=Math.round(video.videoWidth*scale);capture.height=Math.round(video.videoHeight*scale);
      capturePen.drawImage(video,0,0,capture.width,capture.height);
      const image=capture.toDataURL('image/jpeg',.78).split(',')[1];
      pending={sequence:++sequence,sent:now};lastSent=now;
      send({event:'frame',stream_id:streamId,sequence,image});
    }
    if(pending&&now-pending.sent>12000){detection=null;notice('La conexión está tardando. Detén y vuelve a activar la cámara.',true);}
  }
  requestAnimationFrame(tick);
}
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.type!=='streamlit:render')return;
  const args=event.data.args||{};enabled=!event.data.disabled;interval=Math.max(200,args.interval_ms||250);
  const reply=args.response;
  if(reply&&reply.stream_id===streamId&&pending&&reply.sequence===pending.sequence){
    const recent=performance.now()-pending.sent<1200;
    pending=null;detection=recent?reply.detection:null;lastDetection=performance.now();
    if(reply.error)notice(reply.error,true);else notice('');
  }
  buttons();resize();
});
$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>stop());
$('device').addEventListener('change',async()=>{if(media){stop();await start();}});
window.addEventListener('pagehide',()=>stop(false));window.addEventListener('beforeunload',()=>stop(false));
new ResizeObserver(resize).observe(document.body);
devices().catch(()=>{});post('streamlit:componentReady',{apiVersion:1});resize();requestAnimationFrame(tick);
</script></body></html>
